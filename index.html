<style>
  :root {
    --bg: #14161a;
    --win: #1b1e24;
    --bar: #262a32;
    --text: #d8dce3;
    --dim: #7c8493;
    --accent: #15E615;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: courier;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .terminal {
    width: 100%;
    max-width: 720px;
    background: var(--win);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--bar);
    -webkit-user-select: none; /* Safari */
    -ms-user-select: none; /* IE 10 and IE 11 */
    user-select: none; /* Standard syntax */
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot:nth-child(1) { background: #ff5f57; }
  .dot:nth-child(2) { background: #febc2e; }
  .dot:nth-child(3) { background: #28c840; }
  .title { margin-left: 8px; font-size: 13px; color: var(--dim); }
  .body { padding: 20px; min-height: 280px; font-size: 16px; line-height: 1.6; }
  .line { margin: 0 0 4px; white-space: pre-wrap; }
  .dim { color: var(--dim); }
  .accent { color: var(--accent); }
  .prompt { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .prompt span { color: var(--accent); white-space: nowrap; }
  input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--text);
    font: inherit;
    caret-color: var(--accent);
    min-width: 0;
  }
.bg-image {
  background-image: url("Background.jpg");
  height: 100%;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  position: fixed;
  inset: 0;
  z-index: -1;
}
.credit {
  bottom: 0;
  position: fixed;
  width: 100%;
}
.credit a {
  color: #15E615;
  font-size: 8px;
  -webkit-user-select: none; /* Safari */
  -ms-user-select: none; /* IE 10 and IE 11 */
  user-select: none; /* Standard syntax */
}
.credit a:hover {
  color: #FF0000;
}
.credit p {
  color: #FFFFFF;
  font-size: 8px;
  -webkit-user-select: none; /* Safari */
  -ms-user-select: none; /* IE 10 and IE 11 */
  user-select: none; /* Standard syntax */
}
</style>

  function looksLikeUrl(s) {
    if (/\s/.test(s)) return false;
    if (/^https?:\/\//i.test(s)) return true;
    if (/^localhost(:\d+)?(\/|$)/i.test(s)) return true;
    return /^[^\s\/]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(s);
  }

  function resolve(raw) {
    const q = raw.trim();
    const [first, ...rest] = q.split(/\s+/);
    const key = first.toLowerCase();
    const term = rest.join(" ");

    if (shortcuts[key]) {
      const s = shortcuts[key];
      if (term && s.copy && navigator.clipboard) navigator.clipboard.writeText(term).catch(() => {});
      if (term && s.search) return s.search + encodeURIComponent(term);
      return s.url;
    }
    if (looksLikeUrl(q)) {
      return /^(https?:\/\/)/i.test(q) ? q : "https://" + q;
    }
    return "https://www.google.com/search?q=" + encodeURIComponent(q);
  }

  const fallbacks = [
    "Hmm, I'm not sure what to say to that. Try a greeting, a joke, or the weather.", "Interesting! Tell me more.", "I didn't catch that. Say 'help' to see what I know.",
    "I'm only a small bot. Try 'hello', 'joke' or 'what time is it'.", "That's beyond my small talk skills.", "Could you rephrase that?",
    "I don't have an answer for that, but I'm listening.", "Good question! I just don't know the answer."
  ];

  function fmt(s) {
    const d = new Date();
    return s.replace(/\{time\}/g, d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))
            .replace(/\{date\}/g, d.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" }))
            .replace(/\{day\}/g, d.toLocaleDateString(undefined, { weekday: "long" }));
  }

  function pick(id, arr) {
    let i;
    do { i = Math.floor(Math.random() * arr.length); } while (arr.length > 1 && i === lastPick[id]);
    lastPick[id] = i;
    return fmt(arr[i]);
  }

  function matches(words, norm, p) {
    if (p.includes(" ")) return (" " + norm + " ").includes(" " + p + " ");
    return words[0] === p || words[words.length - 1] === p;
  }

  const wmo = (c) => c === 0 ? "clear skies" : c <= 3 ? "some clouds" : c <= 48 ? "fog" : c <= 57 ? "drizzle" : c <= 67 ? "rain"
    : c <= 77 ? "snow" : c <= 82 ? "rain showers" : c <= 86 ? "snow showers" : "thunderstorms";

  // Live weather from Open-Meteo. "weather in Paris" uses that city, otherwise your browser location.
  async function weather(norm) {
    try {
      let lat, lon, place = "your area";
      const m = norm.match(/ in ([a-z ]+)$/);
      if (m) {
        const g = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name=" + encodeURIComponent(m[1].trim()))).json();
        if (!g.results) return "I couldn't find " + m[1].trim() + " on my map.";
        ({ latitude: lat, longitude: lon, name: place } = g.results[0]);
      } else {
        const p = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { timeout: 8000 }));
        lat = p.coords.latitude; lon = p.coords.longitude;
      }
      const w = (await (await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,weather_code,wind_speed_10m")).json()).current;
      const t = Math.round(w.temperature_2m), d = wmo(w.weather_code), wind = Math.round(w.wind_speed_10m);
      return pick("weather", [
        "In " + place + " it's " + t + "°C with " + d + ".", "Right now: " + t + "°C, " + d + " and wind at " + wind + " km/h in " + place + ".",
        place + " is at " + t + "°C with " + d + ".", "It's " + t + "°C in " + place + ", with " + d + " and " + wind + " km/h wind."
      ]);
    } catch (err) {
      return "I can't get the weather right now. Allow location access, or try 'weather in Berlin'.";
    }
  }

  // Random philosopher quote, with the philosopher's name and the year, from philosophersapi.com.
  async function philosopherQuote() {
    try {
      const list = await (await fetch("https://philosophersapi.com/api/quotes")).json();
      const q = list[Math.floor(Math.random() * list.length)];
      let name = "Unknown philosopher";
      if (q.philosopher && q.philosopher.id) {
        const p = await (await fetch("https://philosophersapi.com/api/philosophers/" + q.philosopher.id)).json();
        if (p && p.name) name = p.name;
      }
      const year = (q.year || "").trim() || "year unknown";
      return "\u201C" + q.quote + "\u201D \u2014 " + name + " (" + year + ")";
    } catch (err) {
      return "I can't reach the philosophers API right now. Try again in a bit.";
    }
  }

  // Random Game of Thrones / ASOIAF quote, with the character, from gameofthronesquotes.xyz.
  async function gotQuote() {
    try {
      const q = await (await fetch("https://api.gameofthronesquotes.xyz/v1/random")).json();
      const sentence = q.sentence || q.quote || "";
      const name = (q.character && q.character.name) || "Unknown character";
      return "\u201C" + sentence + "\u201D \u2014 " + name;
    } catch (err) {
      return "I can't reach the Game of Thrones quotes API right now. Try again in a bit.";
    }
  }

  // Short original lines in homage to Rocky's friendly, broken-English speech pattern (not quotes from the
  // film or book). Sprinkled onto ordinary chat so the terminal "quotes Rocky" often, without it taking over
  // topics that already give a real answer (weather, the two quote commands, and Rocky's own topic).
  const rockyFlourishLines = [
    "Good good good!", "Science good. We figure out together.", "Determination! That is the way.",
    "Eleven out of ten, very good.", "We same, you and me, just different legs.", "Problem is good. Problem means we learn.",
    "Four hundred billion dollars and one good friend. Worth it.", "Small steps still steps.", "You are very good human, for human."
  ];
  function rockyFlourish(text) {
    return Math.random() < 0.25 ? text + "\n   (Rocky: \u201C" + pick("rockyflourish", rockyFlourishLines) + "\u201D)" : text;
  }

  async function reply(raw) {
    const norm = raw.toLowerCase().replace(/'/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
    const words = norm.split(" ");
    for (const multi of [true, false]) {          // longer phrases win over single words
      for (const it of intents) {
        if (it.w.some((p) => p.includes(" ") === multi && matches(words, norm, p))) {
          if (it.id === "weather") return await weather(norm);
          if (it.id === "got_quote") return await gotQuote();
          if (it.id === "philosophy_quote") return await philosopherQuote();
          const text = pick(it.id, it.r);
          return (it.id === "rocky" || it.id === "hail_mary") ? text : rockyFlourish(text);
        }
      }
    }
    return rockyFlourish(pick("fallback", fallbacks));
  }

  input.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const value = input.value.trim();
    if (!value) return;

    if (talk) {
      input.value = "";
      if (value.toLowerCase() === "clear") {
        talk = false;
        output.innerHTML = "";
        ps.textContent = "> $ ";
        return;
      }
      if (value.toLowerCase() === "help") {
        print("you > help", "dim");
        print("Small talk keywords (any of these, or a phrase containing them, gets a reply):", "accent");
        for (const it of intents) {
          print("  " + it.id.padEnd(12) + it.w.join(", "), "dim");
        }
        print("Type 'clear' to leave small talk mode.", "accent");
        return;
      }
      print("you > " + value, "dim");
      print("bot > " + await reply(value), "accent");
      return;
    }
    if (value.toLowerCase() === "sudo run smltlk") {
      talk = true;
      input.value = "";
      print("> $ " + value, "dim");
      print("Small talk mode on. Say hi! Type 'clear' to go back to normal mode.", "accent");
      ps.textContent = "you > ";
      return;
    }

    if (value.toLowerCase() === "help") {
      print("> $ help", "dim");
      print("Shortcuts:");
      for (const [k, s] of Object.entries(shortcuts)) {
        print("  " + k.padEnd(6) + s.url.replace("https://", "") + (s.search ? "   (add a search term)" : ""), "dim");
      }
      print("  sudo run smltlk   enter small talk mode (type 'help' there for its keywords)", "dim");
      input.value = "";
      return;
    }
    if (value.toLowerCase() === "clear") {
      output.innerHTML = "";
      input.value = "";
      return;
    }
    if (value.toLowerCase() === "date") {
      print("> $ date", "dim");
      print(new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" }), "accent");
      input.value = "";
      return;
    }

    const target = resolve(value);
    print("> $ " + value, "dim");
    print("Opening " + target, "accent");
    window.open(target, "_blank");
    input.value = "";
  });
